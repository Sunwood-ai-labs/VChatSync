<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同期スクロール・サイドチャット（Spec A）</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --gap: 12px;
      --bg: #0f1115;
      --ink: #e5e7eb;
      --muted: #9aa0a6;
      --panel: #0d1016;
      --panelBorder: #202532;
      --accent: #86e1ff;
      --chip: #1f2937;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 16px
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 360px) 1fr;
      gap: var(--gap);
      padding: var(--gap);
      align-items: start;
    }

    aside.controls {
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      border-radius: 14px;
      padding: 16px;
      position: sticky;
      top: var(--gap);
      height: fit-content;
    }

    section.stage {
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100%;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin: 8px 0 6px
    }

    input[type="file"],
    textarea,
    select,
    button {
      width: 100%
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
      background: #12151b;
      color: var(--ink)
    }

    button {
      background: #1a73e8;
      color: #fff;
      border: 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .hint {
      font-size: 12px;
      color: var(--muted)
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .stage-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .stage-head .sub {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .stage-chip {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(134, 225, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(134, 225, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .stage-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: stretch;
    }

    .video-shell {
      position: relative;
      background: #05070c;
      border: 1px solid var(--panelBorder);
      border-radius: 16px;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 60px rgba(7, 12, 20, 0.35);
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 68vh;
      object-fit: contain;
      background: #000;
    }

    /* --- chat overlay --- */
    .chat-shell {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(165deg, rgba(27, 32, 45, 0.82), rgba(12, 16, 24, 0.92));
      border-radius: 18px;
      border: 1px solid rgba(134, 225, 255, 0.18);
      padding: 16px;
      min-height: 420px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 18px 40px rgba(6, 10, 20, 0.4);
    }

    .chat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .chat-status {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3dd68c;
      box-shadow: 0 0 8px rgba(61, 214, 140, 0.8);
    }

    .chat-list {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 6px;
      scrollbar-width: thin;
    }

    .chat-list::-webkit-scrollbar {
      width: 6px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: rgba(134, 225, 255, 0.3);
      border-radius: 999px;
    }

    .item {
      --accentColor: var(--accent);
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(11, 14, 21, 0.72);
      border: 1px solid rgba(134, 225, 255, 0.12);
      box-shadow: 0 10px 24px rgba(9, 12, 23, 0.5);
      transform: translateY(12px);
      opacity: .3;
      transition: transform .35s ease, opacity .3s ease, border .3s ease;
    }

    .item.visible {
      transform: translateY(0);
      opacity: 1;
      border-color: rgba(134, 225, 255, 0.32);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(134, 225, 255, 0.18), rgba(134, 225, 255, 0.05));
      border: 1px solid rgba(134, 225, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #e5f4ff;
      text-transform: uppercase;
      overflow: hidden;
    }

    .avatar.img {
      padding: 4px;
    }

    .avatar.img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .bubble {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #c2c9d4;
    }

    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 13px;
    }

    .role {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(134, 225, 255, 0.18);
      color: #9de4ff;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .jump {
      appearance: none;
      border: 0;
      background: rgba(134, 225, 255, 0.16);
      color: #c1f0ff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-weight: 600;
      transition: background .2s ease, color .2s ease;
    }

    .jump:hover {
      background: rgba(134, 225, 255, 0.28);
      color: #fff;
    }

    .message {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #e9edf6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between
    }

    .checkbox {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
      color: var(--muted)
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
      }

      aside.controls {
        position: static;
      }

      .stage-layout {
        grid-template-columns: 1fr;
      }

      .chat-shell {
        min-height: 320px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>同期スクロール・サイドチャット（動画と時刻同期 / 横移動なし）</h1>
  </header>

  <main>
    <!-- 左：入力コントロール -->
    <aside class="controls stack">
      <div class="stack">
        <label>元動画（MP4など）</label>
        <input type="file" id="videoFile" accept="video/*" />
        <div class="hint">ローカルファイルのみ。ブラウザ内で処理されます。</div>
      </div>

      <div class="stack">
        <label>コメント（CSV / TSV / JSON いずれか）</label>
        <textarea id="commentsInput"
          placeholder="例（CSV）：&#10;# 秒, テキスト, 色(optional), ロール(optional), 名前(optional), アイコン(optional 絵文字or URL)&#10;1.20, はじめまして！, #88d3ff, 司会, 進行役, 🎤&#10;3.00, なるほど, #c07dff, アナリスト, 佐藤, 🧠&#10;5.50, いいね〜, , 観客, 山田, &#10;&#10;例（JSON）：&#10;[{&quot;t&quot;:1.2,&quot;text&quot;:&quot;はじめまして！&quot;,&quot;color&quot;:&quot;#88d3ff&quot;,&quot;tag&quot;:&quot;司会&quot;,&quot;name&quot;:&quot;進行役&quot;,&quot;avatar&quot;:&quot;🎤&quot;}]"></textarea>
        <div class="row">
          <button id="parseBtn">コメント読み込み</button>
          <button id="demoBtn" title="デモ挿入">デモ挿入</button>
        </div>
        <div class="hint">最小指定は「t(秒), text」。色やタグ（agent種別など）は任意。</div>
      </div>

      <div class="stack">
        <label>オプション</label>
        <div class="controls-row">
          <span class="checkbox"><input type="checkbox" id="autoScroll" checked> 自動スクロールを有効にする</span>
          <button id="jumpLive" title="再生位置の周辺へ">最新へ</button>
        </div>
        <div class="hint">スクロールを手で動かすと自動スクロールは一時停止します（チェックで再開）。</div>
      </div>
    </aside>

    <!-- ライブビュー（動画 + 横チャット） -->
    <section class="stage">
      <div class="stage-head">
        <div>
          <h2>ライブビュー</h2>
          <p class="sub">録画にも映る動画＋サイドチャットのプレビュー</p>
        </div>
        <span class="stage-chip">CHAT READY</span>
      </div>
      <div class="stage-layout">
        <div class="video-shell">
          <video id="video" controls playsinline></video>
        </div>
        <div class="chat-shell">
          <div class="chat-top">
            <span class="chat-title">Live Discussion</span>
            <span class="chat-status">参加者オンライン</span>
          </div>
          <div id="chatList" class="chat-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ====== ユーティリティ ======
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));

    const video = $('#video');
    const videoFile = $('#videoFile');

    const commentsInput = $('#commentsInput');
    const parseBtn = $('#parseBtn');
    const demoBtn = $('#demoBtn');

    const chatList = $('#chatList');
    const chatStatus = $('.chat-status');
    const autoScrollChk = $('#autoScroll');
    const jumpLiveBtn = $('#jumpLive');

    let comments = [];     // {t, text, color?, tag?, name?, avatar?}
    let rendered = false;  // 一度DOMに並べたか
    let userScrolling = false; // ユーザーが手でスクロールしているか

    function formatTime(t) {
      const s = Math.max(0, Math.floor(t));
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    // ====== 入力：動画 ======
    videoFile.addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      video.src = url;
      await video.play().catch(() => { });
    });

    // ====== コメントのパース ======
    function normalizeRow(row) {
      const r = { ...row };
      r.t = Number(r.t ?? r.time ?? 0);
      r.text = String(r.text ?? r.comment ?? '');
      if (!r.text) return null;
      if (isNaN(r.t)) r.t = 0;
      if (r.color === undefined || r.color === null || r.color === '') r.color = '#e5e7eb';
      if (r.role && !r.tag) r.tag = r.role;
      if (r.tag) r.tag = String(r.tag);
      if (r.user && !r.name) r.name = r.user;
      if (r.speaker && !r.name) r.name = r.speaker;
      if (r.name) r.name = String(r.name);
      if (r.avatar) r.avatar = String(r.avatar);
      return r;
    }

    function parseComments(txt) {
      txt = (txt || '').trim();
      if (!txt) return [];
      if (txt.startsWith('[') || txt.startsWith('{')) {
        const arr = JSON.parse(txt);
        return arr.map(normalizeRow).filter(Boolean);
      }
      const lines = txt.split(/\n+/).filter(l => !l.trim().startsWith('#') && l.trim());
      return lines.map(l => {
        // CSV or TSV: t, text, color?, tag?
        const cells = l.split(/\s*,\s*|\t/);
        const row = {
          t: parseFloat(cells[0]),
          text: cells[1] ?? '',
          color: cells[2],
          tag: cells[3],
          name: cells[4],
          avatar: cells[5]
        };
        return normalizeRow(row);
      }).filter(Boolean);
    }

    parseBtn.addEventListener('click', () => {
      try {
        comments = parseComments(commentsInput.value).sort((a, b) => a.t - b.t);
        renderChat();
        alert(`コメント ${comments.length} 件を読み込みました`);
      } catch (e) {
        console.error(e);
        alert('コメントのパースに失敗しました（JSON/CSV/TSV対応）。');
      }
    });

    demoBtn.addEventListener('click', () => {
      commentsInput.value = `# t, text, color, role, name, avatar
0.6, みなさん準備いいですか？, #7dd3ff, Host, 司会 つな, 🎤
2.4, この視点いいですね, #f6a8ff, Analyst, 藍子, 🧠
4.8, うわその発想なかった, #ffd166, Viewer, 佐藤, 🙂
6.2, 今の解説助かる〜, #9ef2c9, Support, リナ, 🍀
9.5, 次のステップいきましょう, #86e1ff, Host, 司会 つな, 🎤
12.4, ここ大事ポイントです, #ffb085, Coach, コウ, 🛠
15.8, なるほどね, #c3f0ff, Viewer, ジョン, 👀`;
    });

    // ====== チャットDOMの構築 ======
    const colorProbe = document.createElement('span');
    colorProbe.style.position = 'absolute';
    colorProbe.style.visibility = 'hidden';
    colorProbe.style.pointerEvents = 'none';
    document.body.appendChild(colorProbe);
    const colorCache = new Map();

    function colorWithAlpha(color, alpha) {
      if (!color) return null;
      const key = `${color}|${alpha}`;
      if (colorCache.has(key)) return colorCache.get(key);
      colorProbe.style.color = color;
      const computed = getComputedStyle(colorProbe).color; // rgb(...) or rgba(...)
      const parts = computed.match(/[\d.]+/g)?.map(Number);
      if (!parts || parts.length < 3) return null;
      const [r, g, b] = parts;
      const result = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      colorCache.set(key, result);
      return result;
    }

    function renderChat() {
      chatList.innerHTML = '';
      comments.forEach((c, idx) => {
        const accent = c.color || '#86e1ff';
        const accentSoft = colorWithAlpha(accent, 0.2) || 'rgba(134,225,255,0.2)';
        const accentLine = colorWithAlpha(accent, 0.45) || 'rgba(134,225,255,0.45)';

        const name = (c.name && c.name.trim()) || `Viewer #${idx + 1}`;
        const avatarToken = (c.avatar && c.avatar.trim()) || '';

        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.t = c.t;
        item.style.borderColor = accentLine;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (/^https?:\/\//i.test(avatarToken) || avatarToken.startsWith('data:')) {
          avatar.classList.add('img');
          const img = document.createElement('img');
          img.src = avatarToken;
          img.alt = name;
          avatar.appendChild(img);
        } else if (avatarToken) {
          avatar.textContent = avatarToken.slice(0, 2);
        } else {
          avatar.textContent = name.slice(0, 2).toUpperCase();
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const head = document.createElement('div');
        head.className = 'bubble-head';

        const headLeft = document.createElement('div');
        headLeft.className = 'head-left';

        const nameEl = document.createElement('span');
        nameEl.className = 'name';
        nameEl.textContent = name;
        headLeft.appendChild(nameEl);

        if (c.tag) {
          const role = document.createElement('span');
          role.className = 'role';
          role.textContent = c.tag;
          role.style.background = accentSoft;
          role.style.color = colorWithAlpha(accent, 0.9) || accent;
          headLeft.appendChild(role);
        }

        head.appendChild(headLeft);

        const jump = document.createElement('button');
        jump.type = 'button';
        jump.className = 'jump';
        jump.textContent = formatTime(c.t);
        jump.title = 'この時刻へジャンプ';
        jump.style.background = accentSoft;
        jump.style.color = colorWithAlpha(accent, 0.8) || accent;
        jump.addEventListener('click', (ev) => {
          ev.preventDefault();
          video.currentTime = c.t + 0.01;
          video.play();
          scrollToCurrent(true);
        });
        head.appendChild(jump);

        const message = document.createElement('p');
        message.className = 'message';
        message.textContent = c.text;
        if (c.color) message.style.color = colorWithAlpha(accent, 0.92) || accent;

        bubble.appendChild(head);
        bubble.appendChild(message);

        item.appendChild(avatar);
        item.appendChild(bubble);

        chatList.appendChild(item);
      });

      if (chatStatus) {
        const participantSet = new Set();
        comments.forEach((c, idx) => {
          const n = (c.name && c.name.trim()) || `Viewer #${idx + 1}`;
          participantSet.add(n);
        });
        chatStatus.textContent = `参加者 ${participantSet.size} 人`;
      }

      rendered = true;
      updateVisibility(video.currentTime);
      if (autoScrollChk.checked) scrollToCurrent(true);
    }

    // ====== 同期：可視/強調＆スクロール ======
    function updateVisibility(now) {
      // 出現時刻を過ぎたものに .visible を付与
      const items = $$('#chatList .item');
      for (const el of items) {
        const tt = Number(el.dataset.t);
        if (now + 0.001 >= tt) el.classList.add('visible');
        else el.classList.remove('visible');
      }
    }

    function scrollToCurrent(force = false) {
      if (!rendered) return;
      if (!force && (!autoScrollChk.checked || userScrolling)) return;

      const items = $$('#chatList .item.visible');
      if (items.length === 0) { chatList.scrollTop = 0; return; }
      const last = items[items.length - 1];
      const top = last.offsetTop - 12; // 余白
      chatList.scrollTo({ top, behavior: 'smooth' });
    }

    // 動画時間に合わせて更新
    let ticking = false;
    function onTimeUpdate() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        updateVisibility(video.currentTime);
        scrollToCurrent(false);
        ticking = false;
      });
    }
    video.addEventListener('timeupdate', onTimeUpdate);
    video.addEventListener('seeked', () => { updateVisibility(video.currentTime); scrollToCurrent(true); });
    video.addEventListener('play', () => { if (autoScrollChk.checked) scrollToCurrent(true); });

    // ユーザースクロール検知
    let scrollTimeout = null;
    chatList.addEventListener('pointerdown', () => userScrolling = true);
    chatList.addEventListener('wheel', () => { userScrolling = true; clearTimeout(scrollTimeout); scrollTimeout = setTimeout(() => userScrolling = false, 800); });
    chatList.addEventListener('touchmove', () => { userScrolling = true; clearTimeout(scrollTimeout); scrollTimeout = setTimeout(() => userScrolling = false, 800); });

    autoScrollChk.addEventListener('change', () => { if (autoScrollChk.checked) scrollToCurrent(true); });
    jumpLiveBtn.addEventListener('click', () => scrollToCurrent(true));

    // 初期：空チャットを出しておく
    renderChat();
  </script>
</body>

</html>
