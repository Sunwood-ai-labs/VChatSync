<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同期スクロール・サイドチャット（Spec A）</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --gap: 12px;
      --bg: #0f1115;
      --ink: #e5e7eb;
      --muted: #9aa0a6;
      --panel: #0d1016;
      --panelBorder: #202532;
      --accent: #86e1ff;
      --chip: #1f2937;
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; }
    header { padding: 16px 20px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px }
    header h1 { font-size: 18px; margin: 0; font-weight: 700 }

    main { display: grid; grid-template-columns: 360px 1fr 340px; gap: var(--gap); padding: var(--gap); }
    aside.controls, aside.chat { background: var(--panel); border: 1px solid var(--panelBorder); border-radius: 14px; padding: 12px; }
    section.stage { background: var(--panel); border: 1px solid var(--panelBorder); border-radius: 14px; padding: 12px; display: grid; grid-template-rows: auto 1fr; gap: 8px }
    label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 6px }
    input[type="file"], textarea, select, button { width: 100% }
    textarea { min-height: 140px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid #2a2f3a; background: #12151b; color: var(--ink) }
    button { background: #1a73e8; color: #fff; border: 0; padding: 10px 12px; border-radius: 10px; font-weight: 600; cursor: pointer }
    button:disabled { opacity: .5; cursor: not-allowed }
    .row { display: flex; gap: 8px; align-items: center }
    .hint { font-size: 12px; color: var(--muted) }
    .stack { display: flex; flex-direction: column; gap: 10px }
    video { width: 100%; max-height: 65vh; background: #000; border-radius: 10px }

    /* --- chat --- */
    .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px }
    .chip { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--chip); color: #cbd5e1 }
    .chat-list { height: calc(100vh - 220px); overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px }
    .item { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); opacity: .45; transition: opacity .15s ease }
    .item.visible { opacity: 1 }
    .item .t { font-variant-numeric: tabular-nums; color: #aab1b8; font-size: 12px }
    .item .text { line-height: 1.35 }
    .item .meta { display:flex; gap:6px; align-items:center }
    .seek { color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: none; }
    .badge { background: #0b1220; border: 1px solid #1e293b; padding: 2px 6px; border-radius: 999px; font-size: 11px; color: #cde7ff }

    .controls-row { display:flex; gap:10px; align-items:center; justify-content: space-between }
    .checkbox { display:flex; gap:6px; align-items:center; font-size:12px; color: var(--muted) }
  </style>
</head>
<body>
  <header>
    <h1>同期スクロール・サイドチャット（動画と時刻同期 / 横移動なし）</h1>
  </header>
</body>
</html>
