<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VChatSync</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <header>
    <h1>VChatSync</h1>
  </header>

  <main>
    <!-- 左：入力コントロール -->
    <aside class="controls stack">
      <div class="stack">
        <label for="videoFile">元動画（MP4など）</label>
        <input type="file" id="videoFile" accept="video/*" />
        <div class="hint">ローカルファイルのみ。ブラウザ内で処理されます。</div>
      </div>

      <div class="stack">
        <label for="commentsInput">コメント（CSV / TSV / JSON いずれか）</label>
        <textarea id="commentsInput"
          placeholder="例（CSV）：&#10;# 秒, テキスト, 色(optional), ロール(optional), 名前(optional), アイコン(optional 絵文字or URL), ピックアップ(optional true/false)&#10;0.60, みなさん準備いいですか？ 今日のセッションでは実際のライブ配信を想定して、VChatSyncでコメント同期を試します。, #7dd3ff, 司会, つな, 🎤, &#10;2.40, この視点いいですね。コメント側で解説を拾ってくれるので、後半のまとめがスムーズにできそうです。, #f6a8ff, アナリスト, 藍子, 🧠, true&#10;4.80, なるほどその機能！ ピックアップ欄があるおかげで重要なコメントを逃さずキャプチャできますね。, #ffd166, 観客, 佐藤, 🙂, yes&#10;&#10;例（JSON）：&#10;[{&quot;t&quot;:26.7,&quot;text&quot;:&quot;ここで用語メモ：「カルーセルUI」= 横スワイプや矢印操作で複数カードを切り替える表示形式。SNS広告やチャットボットで多用。&quot;,&quot;color&quot;:&quot;#7dd3ff&quot;,&quot;tag&quot;:&quot;司会&quot;,&quot;name&quot;:&quot;つな&quot;,&quot;avatar&quot;:&quot;🎤&quot;,&quot;pickup&quot;:true}]"></textarea>
        <div class="row">
          <button id="parseBtn">コメント読み込み</button>
          <button id="demoBtn" title="デモ挿入">デモ挿入</button>
        </div>
        <div class="hint">最小指定は「t(秒), text」。色やタグ（agent種別など）は任意。ピックアップは pickup 列に true / yes などを記入。</div>
      </div>

      <div class="stack">
        <label>オプション</label>
        <div class="controls-row">
          <span class="checkbox"><input type="checkbox" id="autoScroll" checked> 自動スクロールを有効にする</span>
          <button id="jumpLive" title="再生位置の周辺へ">最新へ</button>
        </div>
        <div class="hint">スクロールを手で動かすと自動スクロールは一時停止します（チェックで再開）。</div>
      </div>
    </aside>

    <!-- ライブビュー（動画 + 横チャット） -->
    <section class="stage">
      <div class="stage-head">
        <div>
          <h2>ライブビュー</h2>
          <p class="sub">録画にも映る動画＋サイドチャットのプレビュー</p>
        </div>
        <span class="stage-chip">CHAT READY</span>
      </div>
      <div class="stage-layout">
        <div class="video-column">
          <div class="video-shell">
            <video id="video" controls playsinline></video>
          </div>
          <section class="pickup-area">
            <div class="pickup-head">
              <h3>ピックアップ解説</h3>
              <p class="pickup-sub">重要なコメントや用語の補足をここでチェック</p>
            </div>
            <div id="pickupEmpty" class="pickup-empty">ピックアップ対象のコメントはまだありません。</div>
            <div id="pickupList" class="pickup-list"></div>
          </section>
        </div>
        <div class="chat-shell">
          <div class="chat-top">
            <span class="chat-title">Live Discussion</span>
            <span class="chat-status">参加者オンライン</span>
          </div>
          <div id="chatList" class="chat-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
